name: Build, test, and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  CONFIGURATION: Release
  SOLUTION: NohBoard/NohBoard.sln
  PROJECT: NohBoard/NohBoard/NohBoard.csproj
  TESTS: NohBoard/NohBoard.Tests/NohBoard.Tests.csproj

jobs:
  build-and-test:
    name: Build and test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test ${{ env.TESTS }} -c ${{ env.CONFIGURATION }} --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

  release:
    name: Publish single-file binaries
    runs-on: windows-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Publish self-contained
        run: >
          dotnet publish ${{ env.PROJECT }}
          -p:PublishProfile=win-x64-selfcontained
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Publish framework-dependent
        run: >
          dotnet publish ${{ env.PROJECT }}
          -p:PublishProfile=win-x64-framework-dependent
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Stage artifacts
        shell: pwsh
        run: |
          $sc = "NohBoard/NohBoard/bin/Release/publish/win-x64-selfcontained"
          $fd = "NohBoard/NohBoard/bin/Release/publish/win-x64-framework-dependent"

          New-Item -ItemType Directory -Force -Path artifacts/selfcontained,artifacts/framework-dependent | Out-Null

          Copy-Item "$sc/NohBoard.exe" artifacts/selfcontained/
          Copy-Item -Recurse keyboards artifacts/selfcontained/
          Copy-Item README.md,LICENSE artifacts/selfcontained/

          Copy-Item "$fd/NohBoard.exe" artifacts/framework-dependent/
          Copy-Item -Recurse keyboards artifacts/framework-dependent/
          Copy-Item README.md,LICENSE artifacts/framework-dependent/

          Compress-Archive -Path artifacts/selfcontained/* `
            -DestinationPath "NohBoard-${{ steps.version.outputs.version }}-win-x64-selfcontained.zip"
          Compress-Archive -Path artifacts/framework-dependent/* `
            -DestinationPath "NohBoard-${{ steps.version.outputs.version }}-win-x64-framework-dependent.zip"

      - name: Upload self-contained artifact
        uses: actions/upload-artifact@v4
        with:
          name: NohBoard-win-x64-selfcontained
          path: NohBoard-*-win-x64-selfcontained.zip

      - name: Upload framework-dependent artifact
        uses: actions/upload-artifact@v4
        with:
          name: NohBoard-win-x64-framework-dependent
          path: NohBoard-*-win-x64-framework-dependent.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NohBoard ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            NohBoard-*-win-x64-selfcontained.zip
            NohBoard-*-win-x64-framework-dependent.zip
